[package]
name = "claude-mindmap"
version = "0.1.0"
edition = "2021"

[lib]
name = "claude_mindmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
once_cell = "1"
# 비밀 메모: Electron safeStorage(맥) 호환 — PBKDF2-SHA1 + AES-128-CBC
pbkdf2 = "0.12"
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "s"
